<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Примеры Рационов Питания</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f7f7f7; padding: 20px; font-size: 13px; }
        .container { max-width: 1400px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        h1 { font-size: 24px; margin-bottom: 12px; text-align: left; }

        .block-switcher { display: flex; gap: 8px; background: #f0f2f5; padding: 4px; border-radius: 30px; margin-bottom: 16px; max-width: 480px; margin-left: 0; margin-right: auto; flex-wrap: wrap; }
        .block-switcher button { border: none; background: transparent; padding: 8px 16px; border-radius: 30px; cursor: pointer; font-size: 13px; font-weight: 600; transition: 0.2s; color: #555; flex: 1; min-width: 80px; }
        .block-switcher button.active { background: #2a7de1; color: #fff; }
        .block-switcher button:hover:not(.active) { background: #e0e0e0; }

        .filters { display: flex; flex-wrap: wrap; gap: 10px 20px; padding: 12px 0; border-bottom: 1px solid #e0e0e0; margin-bottom: 16px; align-items: center; }
        .filter-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
        .filter-row .label { font-weight: 600; font-size: 12px; color: #555; }
        .filter-row .day-block { display: flex; flex-wrap: wrap; gap: 2px 6px; }
        .filter-row .day-block label { font-weight: 400; font-size: 12px; }
        .filter-row input[type="checkbox"] { margin-right: 2px; accent-color: #2a7de1; }
        .btn { background: #2a7de1; color: #fff; border: none; padding: 8px 20px; border-radius: 24px; cursor: pointer; font-size: 13px; transition: 0.2s; }
        .btn:hover { background: #1a5fb0; }
        .btn-secondary { background: #e0e0e0; color: #333; }
        .btn-secondary:hover { background: #ccc; }
        .btn-success { background: #28a745; color: #fff; }
        .btn-success:hover { background: #1e7e34; }
        .flex { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        .mt-10 { margin-top: 10px; }
        .mb-10 { margin-bottom: 10px; }
        .hidden { display: none !important; }
        .empty { color: #999; padding: 20px 0; text-align: center; }
        .text-muted { color: #666; font-size: 12px; }

        /* ===== КАРТОЧКИ ДНЕЙ ===== */
        .cards-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 16px; }
        @media (max-width: 900px) { .cards-wrapper { grid-template-columns: 1fr; } }

        .day-card { background: #fafafa; border-radius: 12px; padding: 16px; border: 1px solid #eee; }
        .day-card h3 { font-size: 16px; margin-bottom: 8px; border-bottom: 1px dashed #ddd; padding-bottom: 4px; }
        .day-card .meal { margin: 8px 0 4px 0; }
        .day-card .meal strong { color: #2a7de1; font-size: 13px; }
        .day-card .meal .ingr { font-size: 12px; color: #333; display: block; margin-left: 12px; }
        .day-card .meal .method { font-size: 11px; color: #666; display: block; margin-left: 12px; font-style: italic; }
        .day-card .meal .protein-tag { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 10px; margin-left: 6px; background: #eaeaea; }
        .day-card .meal .protein-tag.animal { background: #f8d7da; color: #721c24; }
        .day-card .meal .protein-tag.plant { background: #d1ecf1; color: #0c5460; }
        .day-card .meal .protein-tag.mixed { background: #fff3cd; color: #856404; }

        /* ===== КОРЗИНА ===== */
        .basket-section { margin-top: 30px; padding-top: 20px; border-top: 2px solid #2a7de1; text-align: left; }
        .basket-section h2 { font-size: 18px; margin-bottom: 4px; }
        .basket-section .sub { font-size: 12px; color: #666; margin-bottom: 12px; }
        .basket-empty { color: #999; padding: 20px 0; text-align: left; }
        .basket-table-wrapper { max-width: 100%; overflow-x: auto; margin: 8px 0 12px 0; }
        .basket-table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; border: 1px solid #ddd; }
        .basket-table th { background: #eaeaea; padding: 6px 8px; text-align: left; border: 1px solid #ddd; font-weight: 600; }
        .basket-table td { padding: 4px 8px; border: 1px solid #ddd; vertical-align: middle; }
        .basket-table .col-name { width: 30%; }
        .basket-table .col-weight-cooked { width: 12%; }
        .basket-table .col-weight-raw { width: 12%; }
        .basket-table .col-unit { width: 10%; }
        .basket-table .col-check { width: 10%; text-align: center; }
        .basket-table .col-actions { width: 12%; text-align: center; }
        .basket-table input[type="text"], .basket-table input[type="number"] { width: 100%; padding: 4px 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; box-sizing: border-box; }
        .basket-table .check-col input[type="checkbox"] { accent-color: #2a7de1; transform: scale(1.2); cursor: pointer; }
        .basket-table .btn-icon { background: none; border: none; cursor: pointer; font-size: 16px; padding: 2px 6px; border-radius: 4px; transition: 0.2s; }
        .basket-table .btn-icon:hover { background: #eaeaea; }
        .basket-table .btn-icon.delete:hover { background: #ffe0e0; color: #d00; }
        .basket-table .add-row td { background: #f9f9f9; padding: 6px 8px; }
        .basket-table .add-row input { width: 100%; padding: 4px 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; box-sizing: border-box; }
        .basket-table .add-row .btn-add { background: #2a7de1; color: #fff; border: none; padding: 4px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; transition: 0.2s; }
        .basket-table .add-row .btn-add:hover { background: #1a5fb0; }

        /* ===== ИТОГОВЫЙ СПИСОК ===== */
        .final-list { margin-top: 20px; padding-top: 16px; border-top: 2px solid #2a7de1; text-align: left; }
        .final-list h3 { font-size: 16px; margin-bottom: 8px; }
        .final-list .basket-table-wrapper { margin: 0; }
        .final-list .basket-table { font-size: 13px; }
        .final-list .basket-table .col-name { width: 45%; }
        .final-list .basket-table .col-weight-cooked { width: 15%; }
        .final-list .basket-table .col-weight-raw { width: 15%; }
        .final-list .basket-table .col-unit { width: 15%; }
        .final-list .basket-table .col-check { width: 10%; text-align: center; }
        .final-list .basket-table .col-actions { display: none; }
        .final-list .basket-table th { background: #d4edda; }
        .final-list .basket-table .check-col input[type="checkbox"] { display: none; }

        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 24px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity 0.3s; z-index: 999; pointer-events: none; }
        .toast.show { opacity: 1; }
        .toast.success { background: #28a745; }
        .toast.error { background: #dc3545; }
    </style>
</head>
<body>
<div class="container" id="app">
    <h1>🍽️ Примеры Рационов Питания</h1>

    <div class="block-switcher" id="blockSwitcher">
        <button class="active" data-block="marathon">Марафон</button>
        <button data-block="sama">Сама</button>
        <button data-block="custom">Свои</button>
    </div>

    <div class="filters">
        <div class="filter-row">
            <span class="label">Дни (<span id="daysCount">0</span>):</span>
            <div class="day-block" id="dayFilters"></div>
        </div>
        <div style="margin-left: auto;">
            <button class="btn btn-secondary" id="refreshDataBtn">🔄 Обновить данные</button>
        </div>
    </div>

    <div class="flex mt-10">
        <button class="btn" id="selectAllDays">Выбрать все дни</button>
        <button class="btn btn-secondary" id="clearAllDays">Снять выделение</button>
        <button class="btn" id="buildBasket">🛒 Собрать корзину</button>
    </div>

    <!-- Карточки дней -->
    <div class="cards-wrapper" id="cardsContainer"></div>

    <!-- Корзина -->
    <div class="basket-section" id="basketContainer">
        <h2>🛒 Предварительная Корзина</h2>
        <div class="sub">Отметьте то, что уже есть в наличии дома.</div>
        <div id="basketContent" class="basket-empty">Выберите дни и нажмите «Собрать корзину»</div>
    </div>

    <!-- Итоговый список для покупки -->
    <div class="final-list hidden" id="finalListContainer">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
            <h3>📋 Итоговый Список для Покупки</h3>
            <button class="btn btn-success" id="shareBtn">📤 Поделиться</button>
        </div>
        <div id="finalListContent"></div>
    </div>
</div>

<!-- Toast-уведомление -->
<div class="toast" id="toast"></div>

<script>
    // ================================================================
    // 1. ДАННЫЕ
    // ================================================================
    let allData = { days: [] };
    let currentMode = 'marathon';
    let selectedDays = new Set();
    let basketItems = [];

    // ================================================================
    // 2. ЗАГРУЗКА ДАННЫХ (ТОЛЬКО ИЗ data.json)
    // ================================================================
    function loadData() {
        const container = document.getElementById('cardsContainer');
        container.innerHTML = '<div class="empty">⏳ Загрузка данных...</div>';

        fetch('data.json')
            .then(response => {
                if (!response.ok) throw new Error('Файл не найден');
                return response.json();
            })
            .then(data => {
                allData = data;
                console.log('✅ Данные загружены из data.json');
                // Очищаем localStorage, чтобы не было конфликтов
                localStorage.removeItem('mealData');
                initApp();
                showToast('Данные успешно загружены', 'success');
            })
            .catch(error => {
                console.error('❌ Ошибка загрузки data.json:', error);
                container.innerHTML = `
                    <div class="empty" style="grid-column: 1/-1; color: #d00;">
                        ⚠️ Не удалось загрузить data.json.<br>
                        Убедитесь, что файл находится в той же папке и имеет правильный формат.
                        <br><br>
                        <button class="btn" onclick="loadData()">🔄 Попробовать снова</button>
                    </div>
                `;
                showToast('Ошибка загрузки data.json', 'error');
            });
    }

    // ================================================================
    // 3. ИНИЦИАЛИЗАЦИЯ
    // ================================================================
    function initApp() {
        // При старте ничего не выбрано
        selectedDays.clear();
        renderFilters();
        renderCards();
        // Корзина пуста
        document.getElementById('basketContent').innerHTML = '<div class="basket-empty">Выберите дни и нажмите «Собрать корзину»</div>';
        document.getElementById('finalListContainer').classList.add('hidden');
        basketItems = [];
        localStorage.removeItem('basketItems');
    }

    function getCurrentData() {
        return allData.days.filter(d => d.block === currentMode);
    }

    function getMaxDays() {
        return getCurrentData().length;
    }

    // ================================================================
    // 4. ФИЛЬТР ДНЕЙ
    // ================================================================
    function renderFilters() {
        const container = document.getElementById('dayFilters');
        const countLabel = document.getElementById('daysCount');
        const data = getCurrentData();
        countLabel.textContent = data.length;

        container.innerHTML = '';
        for (const day of data) {
            const label = document.createElement('label');
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.checked = selectedDays.has(day.day);
            cb.dataset.day = day.day;
            cb.addEventListener('change', function() {
                const dayNum = parseInt(this.dataset.day);
                if (this.checked) selectedDays.add(dayNum);
                else selectedDays.delete(dayNum);
                renderCards();
            });
            label.appendChild(cb);
            label.appendChild(document.createTextNode(day.day));
            container.appendChild(label);
        }
    }

    // ================================================================
    // 5. КАРТОЧКИ ДНЕЙ
    // ================================================================
    function renderCards() {
        const container = document.getElementById('cardsContainer');
        const data = getCurrentData();

        const filtered = data.filter(day => {
            // Если ничего не выбрано — показываем все дни
            if (selectedDays.size === 0) return true;
            return selectedDays.has(day.day);
        });

        if (filtered.length === 0) {
            container.innerHTML = '<div class="empty" style="grid-column: 1/-1;">Нет дней, соответствующих фильтрам</div>';
            return;
        }

        let html = '';
        for (const day of filtered) {
            const blockTag = day.block === 'marathon' ? 'МР' : day.block === 'sama' ? 'СМ' : 'СВ';
            html += `<div class="day-card">`;
            html += `<h3>${day.name || 'День ' + day.day} [${blockTag}]</h3>`;

            const meals = ['breakfast', 'lunch', 'snack', 'dinner'];
            const mealLabels = { breakfast: 'Завтрак', lunch: 'Обед', snack: 'Перекус', dinner: 'Ужин' };

            for (const key of meals) {
                const meal = day.meals[key];
                if (!meal) continue;
                const proteinTag = meal.protein_type === 'animal' ? '🥩 животный' :
                                  meal.protein_type === 'plant' ? '🌱 растительный' : '🥗 смешанный';
                const proteinClass = meal.protein_type === 'animal' ? 'animal' :
                                    meal.protein_type === 'plant' ? 'plant' : 'mixed';

                html += `<div class="meal">`;
                html += `<strong>${mealLabels[key]}</strong> — ${meal.name} <span class="protein-tag ${proteinClass}">${proteinTag}</span>`;

                if (meal.ingredients && meal.ingredients.length > 0) {
                    const ingrText = meal.ingredients.map(i =>
                        `${i.product} — ${i.weight_cooked} ${i.unit}`
                    ).join(', ');
                    html += `<span class="ingr">📋 ${ingrText}</span>`;
                }

                if (meal.method) {
                    html += `<span class="method">🔹 ${meal.method}</span>`;
                }

                html += `</div>`;
            }

            html += `</div>`;
        }

        container.innerHTML = html;
    }

    // ================================================================
    // 6. КОРЗИНА
    // ================================================================
    function loadBasketFromStorage() {
        const saved = localStorage.getItem('basketItems');
        if (saved) {
            try {
                basketItems = JSON.parse(saved);
                return;
            } catch (e) {}
        }
        basketItems = [];
    }

    function saveBasketToStorage() {
        localStorage.setItem('basketItems', JSON.stringify(basketItems));
    }

    function buildBasket() {
        const data = getCurrentData();
        const rawBasket = {};
        const daysToCollect = data.filter(d => selectedDays.has(d.day));

        if (daysToCollect.length === 0) {
            showToast('Выберите хотя бы один день', 'error');
            return;
        }

        for (const day of daysToCollect) {
            const meals = ['breakfast', 'lunch', 'snack', 'dinner'];
            for (const key of meals) {
                const meal = day.meals[key];
                if (!meal || !meal.ingredients) continue;
                for (const item of meal.ingredients) {
                    const name = item.product;
                    const cooked = item.weight_cooked || 0;
                    const raw = item.weight_raw || cooked;
                    const unit = item.unit || 'г';
                    const key = `${name}|${unit}`;
                    if (!rawBasket[key]) {
                        rawBasket[key] = { cooked: 0, raw: 0 };
                    }
                    rawBasket[key].cooked += cooked;
                    rawBasket[key].raw += raw;
                }
            }
        }

        loadBasketFromStorage();

        if (basketItems.length === 0) {
            for (const [key, weights] of Object.entries(rawBasket)) {
                const parts = key.split('|');
                const name = parts[0];
                const unit = parts[1] || 'г';
                basketItems.push({
                    name: name,
                    weight_cooked: weights.cooked,
                    weight_raw: weights.raw,
                    unit: unit,
                    available: false
                });
            }
            saveBasketToStorage();
        }

        renderBasketTable();
        document.getElementById('finalListContainer').classList.remove('hidden');
        updateFinalList();
        showToast(`Собрано ${basketItems.length} продуктов`, 'success');
    }

    function renderBasketTable() {
        const container = document.getElementById('basketContent');
        if (basketItems.length === 0) {
            container.innerHTML = '<div class="basket-empty">Корзина пуста. Выберите дни и нажмите «Собрать корзину»</div>';
            return;
        }

        let html = `<div class="basket-table-wrapper">
            <table class="basket-table">
                <thead>
                    <tr>
                        <th class="col-name">Название продукта</th>
                        <th class="col-weight-cooked">Вес (готовый)</th>
                        <th class="col-weight-raw">Вес (сырой)</th>
                        <th class="col-unit">Ед. изм.</th>
                        <th class="col-check">В наличии</th>
                        <th class="col-actions">Действие</th>
                    </tr>
                </thead>
                <tbody>`;

        basketItems.forEach((item, index) => {
            const checked = item.available ? 'checked' : '';
            html += `
                <tr data-index="${index}">
                    <td class="col-name">
                        <input type="text" value="${escapeHtml(item.name)}" data-field="name" data-index="${index}">
                    </td>
                    <td class="col-weight-cooked">
                        <input type="number" value="${item.weight_cooked}" data-field="weight_cooked" data-index="${index}" step="any">
                    </td>
                    <td class="col-weight-raw">
                        <input type="number" value="${item.weight_raw || item.weight_cooked}" data-field="weight_raw" data-index="${index}" step="any">
                    </td>
                    <td class="col-unit">
                        <input type="text" value="${escapeHtml(item.unit)}" data-field="unit" data-index="${index}">
                    </td>
                    <td class="col-check">
                        <input type="checkbox" ${checked} data-field="available" data-index="${index}">
                    </td>
                    <td class="col-actions">
                        <button class="btn-icon delete" data-index="${index}" title="Удалить">🗑️</button>
                    </td>
                </tr>`;
        });

        html += `
                <tr class="add-row">
                    <td><input type="text" id="newName" placeholder="Название"></td>
                    <td><input type="number" id="newWeightCooked" placeholder="Готовый вес" step="any"></td>
                    <td><input type="number" id="newWeightRaw" placeholder="Сырой вес" step="any"></td>
                    <td><input type="text" id="newUnit" placeholder="г / мл / шт"></td>
                    <td></td>
                    <td><button class="btn-add" id="addProductBtn">➕ Добавить</button></td>
                </tr>
            </tbody></table></div>`;

        container.innerHTML = html;

        container.querySelectorAll('input[data-field]').forEach(input => {
            input.addEventListener('change', function() {
                const index = parseInt(this.dataset.index);
                const field = this.dataset.field;
                if (field === 'name') basketItems[index].name = this.value;
                else if (field === 'weight_cooked') basketItems[index].weight_cooked = parseFloat(this.value) || 0;
                else if (field === 'weight_raw') basketItems[index].weight_raw = parseFloat(this.value) || 0;
                else if (field === 'unit') basketItems[index].unit = this.value;
                else if (field === 'available') basketItems[index].available = this.checked;
                saveBasketToStorage();
                updateFinalList();
            });
        });

        container.querySelectorAll('.btn-icon.delete').forEach(btn => {
            btn.addEventListener('click', function() {
                const index = parseInt(this.dataset.index);
                basketItems.splice(index, 1);
                saveBasketToStorage();
                renderBasketTable();
                updateFinalList();
            });
        });

        document.getElementById('addProductBtn').addEventListener('click', function() {
            const name = document.getElementById('newName').value.trim();
            const weight_cooked = parseFloat(document.getElementById('newWeightCooked').value);
            const weight_raw = parseFloat(document.getElementById('newWeightRaw').value) || weight_cooked;
            const unit = document.getElementById('newUnit').value.trim() || 'г';
            if (!name || isNaN(weight_cooked) || weight_cooked <= 0) {
                alert('Пожалуйста, заполните название и вес');
                return;
            }
            basketItems.push({ name, weight_cooked, weight_raw, unit, available: false });
            saveBasketToStorage();
            renderBasketTable();
            updateFinalList();
            document.getElementById('newName').value = '';
            document.getElementById('newWeightCooked').value = '';
            document.getElementById('newWeightRaw').value = '';
            document.getElementById('newUnit').value = '';
        });
    }

    // ================================================================
    // 7. ИТОГОВЫЙ СПИСОК + ПОДЕЛИТЬСЯ
    // ================================================================
    function updateFinalList() {
        const container = document.getElementById('finalListContent');
        const notAvailable = basketItems.filter(item => !item.available);

        if (notAvailable.length === 0) {
            container.innerHTML = '<div class="basket-empty">Все продукты отмечены как «В наличии» — ничего не нужно покупать! 🎉</div>';
            return;
        }

        let html = `<div class="basket-table-wrapper">
            <table class="basket-table">
                <thead>
                    <tr>
                        <th class="col-name">Название продукта</th>
                        <th class="col-weight-cooked">Вес (готовый)</th>
                        <th class="col-weight-raw">Вес (сырой)</th>
                        <th class="col-unit">Ед. изм.</th>
                    </tr>
                </thead>
                <tbody>`;

        for (const item of notAvailable) {
            const cooked = typeof item.weight_cooked === 'number' ? item.weight_cooked : 0;
            const raw = typeof item.weight_raw === 'number' ? item.weight_raw : cooked;
            html += `
                <tr>
                    <td class="col-name">${escapeHtml(item.name)}</td>
                    <td class="col-weight-cooked">${cooked}</td>
                    <td class="col-weight-raw">${raw}</td>
                    <td class="col-unit">${escapeHtml(item.unit)}</td>
                </tr>`;
        }

        html += `</tbody></table></div>`;
        container.innerHTML = html;
    }

    // ================================================================
    // 8. ПОДЕЛИТЬСЯ (копирование в буфер)
    // ================================================================
    document.getElementById('shareBtn').addEventListener('click', function() {
        const notAvailable = basketItems.filter(item => !item.available);
        if (notAvailable.length === 0) {
            showToast('Нет продуктов для копирования', 'error');
            return;
        }

        let text = '📋 ИТОГОВЫЙ СПИСОК ДЛЯ ПОКУПКИ\n';
        text += '='.repeat(40) + '\n\n';

        for (const item of notAvailable) {
            const cooked = typeof item.weight_cooked === 'number' ? item.weight_cooked : 0;
            const raw = typeof item.weight_raw === 'number' ? item.weight_raw : cooked;
            const unit = item.unit || 'г';
            text += `• ${item.name}\n`;
            text += `  Готовый вес: ${cooked} ${unit}\n`;
            text += `  Сырой вес:   ${raw} ${unit}\n\n`;
        }

        text += '='.repeat(40) + '\n';
        text += `Всего продуктов: ${notAvailable.length}\n`;
        text += `Дата: ${new Date().toLocaleDateString('ru-RU')}`;

        // Копируем в буфер
        navigator.clipboard.writeText(text)
            .then(() => {
                showToast('✅ Список скопирован в буфер обмена!', 'success');
            })
            .catch(() => {
                // Fallback
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('✅ Список скопирован в буфер обмена!', 'success');
            });
    });

    // ================================================================
    // 9. ОБНОВЛЕНИЕ ДАННЫХ ИЗ ФАЙЛА
    // ================================================================
    document.getElementById('refreshDataBtn').addEventListener('click', function() {
        if (confirm('Обновить данные из data.json? Все несохранённые изменения будут потеряны.')) {
            // Очищаем localStorage
            localStorage.removeItem('mealData');
            localStorage.removeItem('basketItems');
            basketItems = [];
            selectedDays.clear();
            loadData();
        }
    });

    // ================================================================
    // 10. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
    // ================================================================
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function showToast(message, type = 'info') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = 'toast show ' + type;
        clearTimeout(toast._timeout);
        toast._timeout = setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }

    // ================================================================
    // 11. ПЕРЕКЛЮЧЕНИЕ БЛОКОВ
    // ================================================================
    document.querySelectorAll('#blockSwitcher button').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('#blockSwitcher button').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentMode = this.dataset.block;
            selectedDays.clear();
            basketItems = [];
            localStorage.removeItem('basketItems');
            document.getElementById('finalListContainer').classList.add('hidden');
            document.getElementById('basketContent').innerHTML = '<div class="basket-empty">Выберите дни и нажмите «Собрать корзину»</div>';
            renderFilters();
            renderCards();
        });
    });

    // ================================================================
    // 12. КНОПКИ ВЫБОРА ДНЕЙ
    // ================================================================
    document.getElementById('selectAllDays').addEventListener('click', function() {
        const data = getCurrentData();
        for (const day of data) {
            selectedDays.add(day.day);
        }
        document.querySelectorAll('#dayFilters input[type="checkbox"]').forEach(cb => cb.checked = true);
        renderCards();
        showToast(`Выбрано ${selectedDays.size} дней`, 'success');
    });

    document.getElementById('clearAllDays').addEventListener('click', function() {
        selectedDays.clear();
        document.querySelectorAll('#dayFilters input[type="checkbox"]').forEach(cb => cb.checked = false);
        renderCards();
    });

    document.getElementById('buildBasket').addEventListener('click', buildBasket);

    // ================================================================
    // 13. СТАРТ
    // ================================================================
    loadData();
</script>
</body>
</html>
