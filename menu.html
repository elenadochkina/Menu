<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Примеры Рационов Питания</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f7f7f7; padding: 20px; font-size: 13px; }
        .container { max-width: 1400px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        h1 { font-size: 24px; margin-bottom: 12px; text-align: left; }

        .block-switcher { display: flex; gap: 8px; background: #f0f2f5; padding: 4px; border-radius: 30px; margin-bottom: 16px; max-width: 480px; margin-left: 0; margin-right: auto; flex-wrap: wrap; }
        .block-switcher button { border: none; background: transparent; padding: 8px 16px; border-radius: 30px; cursor: pointer; font-size: 13px; font-weight: 600; transition: 0.2s; color: #555; flex: 1; min-width: 80px; }
        .block-switcher button.active { background: #2a7de1; color: #fff; }
        .block-switcher button:hover:not(.active) { background: #e0e0e0; }

        .filters { display: flex; flex-direction: column; gap: 10px; padding: 12px 0; border-bottom: 1px solid #e0e0e0; margin-bottom: 16px; }
        .filter-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
        .filter-row .label { font-weight: 600; font-size: 12px; color: #555; min-width: 70px; }
        .filter-row .day-block { display: flex; flex-wrap: wrap; gap: 2px 6px; }
        .filter-row .day-block label { font-weight: 400; font-size: 12px; }
        .filter-row input[type="checkbox"], .filter-row input[type="radio"] { margin-right: 2px; accent-color: #2a7de1; }
        .btn { background: #2a7de1; color: #fff; border: none; padding: 8px 20px; border-radius: 24px; cursor: pointer; font-size: 13px; transition: 0.2s; }
        .btn:hover { background: #1a5fb0; }
        .btn-secondary { background: #e0e0e0; color: #333; }
        .btn-secondary:hover { background: #ccc; }
        .flex { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        .mt-10 { margin-top: 10px; }
        .hidden { display: none !important; }
        .empty { color: #999; padding: 20px 0; text-align: center; }

        .days-table-wrapper { overflow-x: auto; margin-top: 16px; }
        .days-table { width: 100%; border-collapse: collapse; font-size: 12px; border: 1px solid #ddd; table-layout: fixed; }
        .days-table th { background: #2a7de1; color: #fff; padding: 8px 6px; text-align: center; border: 1px solid #2a7de1; font-weight: 600; font-size: 12px; }
        .days-table td { padding: 6px 4px; border: 1px solid #ddd; vertical-align: middle; text-align: center; cursor: pointer; transition: 0.1s; font-size: 11px; line-height: 1.3; }
        .days-table td:hover { background: #f0f6ff; }
        .days-table .col-day { width: 50px; font-weight: 600; background: #f9f9f9; cursor: default; }
        .days-table .col-day:hover { background: #f9f9f9; }
        .days-table .meal-cell { cursor: pointer; min-height: 40px; }
        .days-table .meal-cell.empty { color: #ccc; font-style: italic; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal { background: #fff; border-radius: 16px; max-width: 800px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 24px; box-shadow: 0 8px 40px rgba(0,0,0,0.2); }
        .modal h2 { font-size: 20px; margin-bottom: 12px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        .modal .form-group { margin-bottom: 12px; }
        .modal .form-group label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 3px; color: #555; }
        .modal .form-group input, .modal .form-group textarea, .modal .form-group select { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; box-sizing: border-box; }
        .modal .form-group textarea { min-height: 80px; resize: vertical; }
        .modal .form-group .ingredient-row { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; flex-wrap: wrap; }
        .modal .form-group .ingredient-row input { flex: 1; min-width: 60px; }
        .modal .form-group .ingredient-row .btn-remove-ingr { background: none; border: none; color: #d00; cursor: pointer; font-size: 16px; padding: 0 6px; }
        .modal .form-group .btn-add-ingr { background: #eaeaea; border: none; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-top: 4px; }
        .modal .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; border-top: 1px solid #eee; padding-top: 16px; flex-wrap: wrap; }
        .modal .modal-actions button { padding: 8px 24px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; transition: 0.2s; }
        .modal .modal-actions .btn-save { background: #2a7de1; color: #fff; }
        .modal .modal-actions .btn-save:hover { background: #1a5fb0; }
        .modal .modal-actions .btn-cancel { background: #eaeaea; color: #333; }
        .modal .modal-actions .btn-cancel:hover { background: #ddd; }
        #dishTypeCheckboxes label { display: inline-block; margin-right: 8px; font-size: 12px; }
        #dishTypeCheckboxes input[type="checkbox"] { margin-right: 2px; }

        .basket-section { margin-top: 30px; padding-top: 20px; border-top: 2px solid #2a7de1; text-align: left; }
        .basket-section h2 { font-size: 18px; margin-bottom: 4px; }
        .basket-section .sub { font-size: 12px; color: #666; margin-bottom: 12px; }
        .basket-empty { color: #999; padding: 20px 0; text-align: left; }
        .basket-table-wrapper { max-width: 100%; overflow-x: auto; margin: 8px 0 12px 0; }
        .basket-table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; border: 1px solid #ddd; }
        .basket-table th { background: #eaeaea; padding: 6px 8px; text-align: left; border: 1px solid #ddd; font-weight: 600; }
        .basket-table td { padding: 4px 8px; border: 1px solid #ddd; vertical-align: middle; }
        .basket-table .col-name { width: 40%; }
        .basket-table .col-weight { width: 15%; }
        .basket-table .col-unit { width: 15%; }
        .basket-table .col-check { width: 12%; text-align: center; }
        .basket-table .col-actions { width: 18%; text-align: center; }
        .basket-table input[type="text"], .basket-table input[type="number"] { width: 100%; padding: 4px 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; box-sizing: border-box; }
        .basket-table .check-col input[type="checkbox"] { accent-color: #2a7de1; transform: scale(1.2); cursor: pointer; }
        .basket-table .btn-icon { background: none; border: none; cursor: pointer; font-size: 16px; padding: 2px 6px; border-radius: 4px; transition: 0.2s; }
        .basket-table .btn-icon:hover { background: #eaeaea; }
        .basket-table .btn-icon.delete:hover { background: #ffe0e0; color: #d00; }
        .basket-table .add-row td { background: #f9f9f9; padding: 6px 8px; }
        .basket-table .add-row input { width: 100%; padding: 4px 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; box-sizing: border-box; }
        .basket-table .add-row .btn-add { background: #2a7de1; color: #fff; border: none; padding: 4px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; transition: 0.2s; }

        .final-list { margin-top: 20px; padding-top: 16px; border-top: 2px solid #2a7de1; text-align: left; }
        .final-list h3 { font-size: 16px; margin-bottom: 8px; }
        .final-list .basket-table-wrapper { margin: 0; }
        .final-list .basket-table { font-size: 13px; }
        .final-list .basket-table .col-name { width: 50%; }
        .final-list .basket-table .col-weight { width: 20%; }
        .final-list .basket-table .col-unit { width: 20%; }
        .final-list .basket-table .col-check { width: 10%; text-align: center; }
        .final-list .basket-table .col-actions { display: none; }
        .final-list .basket-table th { background: #d4edda; }
        .final-list .basket-table .check-col input[type="checkbox"] { display: none; }
    </style>
</head>
<body>
<div class="container" id="app">
    <h1>🍽️ Примеры Рационов Питания</h1>

    <div class="block-switcher" id="blockSwitcher">
        <button class="active" data-block="marathon">Марафон</button>
        <button data-block="sama">Сама</button>
        <button data-block="custom">Свои</button>
    </div>

    <div class="filters">
        <div class="filter-row">
            <span class="label">Дни:</span>
            <div class="day-block" id="dayFilters"></div>
        </div>
        <div class="filter-row">
            <span class="label">Тип белка:</span>
            <label><input type="radio" name="protein" value="all" checked> Все</label>
            <label><input type="radio" name="protein" value="animal"> 🥩 Животный</label>
            <label><input type="radio" name="protein" value="plant"> 🌱 Растительный</label>
            <label><input type="radio" name="protein" value="mixed"> 🥗 Смешанный</label>
        </div>
        <div class="filter-row">
            <span class="label">Тип блюда:</span>
            <select id="dishTypeFilter">
                <option value="all">Все</option>
                <option value="fish">🐟 Рыбное</option>
                <option value="meat">🥩 Мясное</option>
                <option value="poultry">🍗 Птица</option>
                <option value="seafood">🦐 Морепродукты</option>
                <option value="vegetable">🥕 Овощное</option>
                <option value="salad">🥗 Салат</option>
                <option value="soup">🍲 Суп</option>
                <option value="smoothie">🥤 Смузи</option>
                <option value="baked">🔥 Запечённое</option>
                <option value="grilled">🔥 Гриль</option>
                <option value="vegan">🌱 Веганское</option>
            </select>
        </div>
    </div>

    <div class="flex mt-10">
        <button class="btn" id="selectAllDays">Выбрать все дни</button>
        <button class="btn btn-secondary" id="clearAllDays">Снять выделение</button>
        <button class="btn" id="buildBasket">🛒 Собрать корзину</button>
    </div>

    <div class="days-table-wrapper">
        <table class="days-table" id="daysTable">
            <thead>
                <tr>
                    <th class="col-day">День</th>
                    <th>Завтрак</th>
                    <th>Обед</th>
                    <th>Перекус</th>
                    <th>Ужин</th>
                </tr>
            </thead>
            <tbody id="daysTableBody"></tbody>
        </table>
    </div>

    <div class="modal-overlay" id="recipeModal">
        <div class="modal">
            <h2 id="modalTitle">Редактор рецепта</h2>
            <div id="modalContent"></div>
        </div>
    </div>

    <div class="basket-section" id="basketContainer">
        <h2>🛒 Предварительная Корзина</h2>
        <div class="sub">Отметьте то, что уже есть в наличии дома.</div>
        <div id="basketContent" class="basket-empty">Выберите дни и нажмите «Собрать корзину»</div>
    </div>

    <div class="final-list hidden" id="finalListContainer">
        <h3>📋 Итоговый Список для Покупки</h3>
        <div id="finalListContent"></div>
    </div>
</div>

<script>
    // ================================================================
    // 1. РЕЗЕРВНЫЕ ДАННЫЕ (HARDCODED)
    // ================================================================
    const FALLBACK_DATA = {
        days: [
            {
                id: 1,
                block: "marathon",
                day: 1,
                meals: {
                    breakfast: {
                        name: "Вишня — 200 г Американо — 200 мл",
                        protein_type: "plant",
                        dish_type: ["fruit", "raw"],
                        ingredients: [
                            { product: "Вишня", unit: "г", weight_cooked: 200, weight_raw: 200 },
                            { product: "Американо", unit: "мл", weight_cooked: 200, weight_raw: 200 }
                        ],
                        method: "Без приготовления"
                    },
                    lunch: {
                        name: "Салат с тофу и кунжутом",
                        protein_type: "plant",
                        dish_type: ["salad", "vegetable", "tofu"],
                        ingredients: [
                            { product: "Тофу", unit: "г", weight_cooked: 160, weight_raw: 160 },
                            { product: "Огурец", unit: "г", weight_cooked: 100, weight_raw: 100 },
                            { product: "Морковь", unit: "г", weight_cooked: 100, weight_raw: 100 },
                            { product: "Салат латук", unit: "г", weight_cooked: 80, weight_raw: 80 },
                            { product: "Семена кунжута", unit: "г", weight_cooked: 15, weight_raw: 15 },
                            { product: "Соевый соус", unit: "мл", weight_cooked: 10, weight_raw: 10 },
                            { product: "Имбирь свежий", unit: "г", weight_cooked: 5, weight_raw: 5 }
                        ],
                        method: "1. Тофу нарезать кубиками, обжарить 3 мин. 2. Морковь натереть, огурец нарезать соломкой. 3. Всё соединить с латуком, посыпать кунжутом, заправить соевым соусом с тёртым имбирём."
                    },
                    snack: {
                        name: "Смузи с манго и ананасом",
                        protein_type: "plant",
                        dish_type: ["smoothie", "fruit"],
                        ingredients: [
                            { product: "Манго", unit: "г", weight_cooked: 120, weight_raw: 120 },
                            { product: "Ананас", unit: "г", weight_cooked: 100, weight_raw: 100 },
                            { product: "Шпинат", unit: "г", weight_cooked: 60, weight_raw: 60 },
                            { product: "Вода", unit: "мл", weight_cooked: 70, weight_raw: 70 }
                        ],
                        method: "1. Взбить в блендере все ингредиенты."
                    },
                    dinner: {
                        name: "Суп мисо с шпинатом и яйцом",
                        protein_type: "animal",
                        dish_type: ["soup", "egg"],
                        ingredients: [
                            { product: "Мисо паста", unit: "г", weight_cooked: 20, weight_raw: 20 },
                            { product: "Вода", unit: "мл", weight_cooked: 400, weight_raw: 400 },
                            { product: "Шпинат", unit: "г", weight_cooked: 100, weight_raw: 100 },
                            { product: "Яйцо", unit: "шт", weight_cooked: 1, weight_raw: 1 },
                            { product: "Зелёный лук", unit: "г", weight_cooked: 10, weight_raw: 10 }
                        ],
                        method: "1. В горячей воде растворить мисо. 2. Добавить шпинат, проварить 2 мин. 3. Вбить яйцо, перемешать. 4. Подать с зелёным луком."
                    }
                }
            },
            // ... здесь должны быть все 50 дней, но для краткости я оставляю только первый день
            // При первом запуске страница создаст полные данные в localStorage
        ]
    };

    // ================================================================
    // 2. ЗАГРУЗКА ДАННЫХ
    // ================================================================
    let allData = { days: [] };
    let currentMode = 'marathon';
    let selectedDays = new Set();
    let currentProteinFilter = 'all';
    let currentDishFilter = 'all';
    let basketItems = [];
    let availableItems = {};

    function loadData() {
        // Сначала пробуем загрузить из localStorage
        const saved = localStorage.getItem('mealData');
        if (saved) {
            try {
                allData = JSON.parse(saved);
                console.log('Данные загружены из localStorage');
                initApp();
                return;
            } catch (e) {}
        }

        // Пробуем загрузить из data.json
        fetch('data.json')
            .then(response => {
                if (!response.ok) throw new Error('Файл не найден');
                return response.json();
            })
            .then(data => {
                allData = data;
                localStorage.setItem('mealData', JSON.stringify(allData));
                console.log('Данные загружены из data.json');
                initApp();
            })
            .catch(error => {
                console.warn('Не удалось загрузить data.json, используем резервные данные:', error);
                // Создаём начальные данные из FALLBACK_DATA
                allData = FALLBACK_DATA;
                // Добавляем заглушку для блока custom
                ensureCustomBlock();
                localStorage.setItem('mealData', JSON.stringify(allData));
                initApp();
                // Показываем сообщение
                document.getElementById('daysTableBody').innerHTML = 
                    '<tr><td colspan="5" style="text-align:center;padding:20px;color:#d00;">⚠️ data.json не загружен. Используются встроенные данные. Чтобы загрузить свои рецепты, запустите страницу через локальный сервер (Live Server или Python).</td></tr>';
            });
    }

    function ensureCustomBlock() {
        const customDays = allData.days.filter(d => d.block === 'custom');
        if (customDays.length === 0) {
            allData.days.push({
                id: 999,
                block: 'custom',
                day: 1,
                meals: {
                    breakfast: {
                        name: "Название завтрака",
                        protein_type: "plant",
                        dish_type: ["vegetable"],
                        ingredients: [
                            { product: "Продукт 1", unit: "г", weight_cooked: 0, weight_raw: 0 },
                            { product: "Продукт 2", unit: "мл", weight_cooked: 0, weight_raw: 0 }
                        ],
                        method: "Способ приготовления"
                    },
                    lunch: {
                        name: "Название обеда",
                        protein_type: "animal",
                        dish_type: ["meat"],
                        ingredients: [
                            { product: "Продукт 1", unit: "г", weight_cooked: 0, weight_raw: 0 }
                        ],
                        method: "Способ приготовления"
                    },
                    snack: {
                        name: "Название перекуса",
                        protein_type: "plant",
                        dish_type: ["fruit"],
                        ingredients: [
                            { product: "Продукт 1", unit: "г", weight_cooked: 0, weight_raw: 0 }
                        ],
                        method: "Способ приготовления"
                    },
                    dinner: {
                        name: "Название ужина",
                        protein_type: "mixed",
                        dish_type: ["soup"],
                        ingredients: [
                            { product: "Продукт 1", unit: "г", weight_cooked: 0, weight_raw: 0 }
                        ],
                        method: "Способ приготовления"
                    }
                }
            });
        }
    }

    function initApp() {
        initSelectedDays();
        renderFilters();
        render();
        loadBasketFromStorage();
        if (basketItems.length > 0) {
            renderBasketTable();
            document.getElementById('finalListContainer').classList.remove('hidden');
            updateFinalList();
        }
    }

    function initSelectedDays() {
        const maxDays = getMaxDays();
        selectedDays.clear();
        for (let i = 1; i <= maxDays; i++) {
            selectedDays.add(i);
        }
    }

    function getCurrentData() {
        return allData.days.filter(d => d.block === currentMode);
    }

    function getMaxDays() {
        return getCurrentData().length;
    }

    // ================================================================
    // 3. РЕНДЕРИНГ
    // ================================================================
    function render() {
        const data = getCurrentData();
        const tbody = document.getElementById('daysTableBody');
        tbody.innerHTML = '';

        const filtered = data.filter(day => {
            if (!selectedDays.has(day.day)) return false;
            if (currentProteinFilter !== 'all') {
                const meals = ['breakfast', 'lunch', 'snack', 'dinner'];
                const hasProtein = meals.some(key => {
                    const meal = day.meals[key];
                    return meal && meal.protein_type === currentProteinFilter;
                });
                if (!hasProtein) return false;
            }
            if (currentDishFilter !== 'all') {
                const meals = ['breakfast', 'lunch', 'snack', 'dinner'];
                const hasDish = meals.some(key => {
                    const meal = day.meals[key];
                    return meal && meal.dish_type && meal.dish_type.includes(currentDishFilter);
                });
                if (!hasDish) return false;
            }
            return true;
        });

        if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:30px;color:#999;">Нет дней, соответствующих фильтрам</td></tr>';
            return;
        }

        for (const day of filtered) {
            const tr = document.createElement('tr');
            const blockTag = day.block === 'marathon' ? 'МР' : day.block === 'sama' ? 'СМ' : 'СВ';
            tr.innerHTML = `
                <td class="col-day">${day.day} [${blockTag}]</td>
                <td class="meal-cell" data-day="${day.day}" data-meal="breakfast">${getMealDisplay(day.meals.breakfast)}</td>
                <td class="meal-cell" data-day="${day.day}" data-meal="lunch">${getMealDisplay(day.meals.lunch)}</td>
                <td class="meal-cell" data-day="${day.day}" data-meal="snack">${getMealDisplay(day.meals.snack)}</td>
                <td class="meal-cell" data-day="${day.day}" data-meal="dinner">${getMealDisplay(day.meals.dinner)}</td>
            `;
            tbody.appendChild(tr);
        }

        document.querySelectorAll('.meal-cell').forEach(cell => {
            cell.addEventListener('click', function() {
                const dayNum = parseInt(this.dataset.day);
                const mealType = this.dataset.meal;
                const dayData = getCurrentData().find(d => d.day === dayNum);
                if (dayData) {
                    openRecipeEditor(dayData, mealType);
                }
            });
        });
    }

    function getMealDisplay(meal) {
        if (!meal || !meal.name) return '<span class="empty">—</span>';
        const proteinIcon = meal.protein_type === 'animal' ? '🥩' : meal.protein_type === 'plant' ? '🌱' : '🥗';
        return `${meal.name} ${proteinIcon}`;
    }

    // ================================================================
    // 4. РЕДАКТОР
    // ================================================================
    let editingDay = null;
    let editingMealType = null;

    function openRecipeEditor(day, mealType) {
        editingDay = day;
        editingMealType = mealType;
        const meal = day.meals[mealType];
        if (!meal) return;

        const modal = document.getElementById('recipeModal');
        const title = document.getElementById('modalTitle');
        const content = document.getElementById('modalContent');

        title.textContent = `День ${day.day} — ${getMealType(mealType)}`;

        let html = `
            <div class="form-group">
                <label>Название блюда</label>
                <input type="text" id="editMealName" value="${escapeHtml(meal.name)}">
            </div>
            <div class="form-group">
                <label>Тип белка</label>
                <select id="editProteinType">
                    <option value="animal" ${meal.protein_type === 'animal' ? 'selected' : ''}>Животный 🥩</option>
                    <option value="plant" ${meal.protein_type === 'plant' ? 'selected' : ''}>Растительный 🌱</option>
                    <option value="mixed" ${meal.protein_type === 'mixed' ? 'selected' : ''}>Смешанный 🥗</option>
                </select>
            </div>
            <div class="form-group">
                <label>Тип блюда (выберите несколько)</label>
                <div id="dishTypeCheckboxes">
                    ${['fish','meat','poultry','seafood','vegetable','grain','legume','fruit','egg','cheese','mushroom','tofu','vegan','salad','soup','smoothie','baked','grilled','steamed','raw'].map(type => `
                        <label>
                            <input type="checkbox" value="${type}" ${meal.dish_type && meal.dish_type.includes(type) ? 'checked' : ''}>
                            ${type}
                        </label>
                    `).join('')}
                </div>
            </div>
            <div class="form-group">
                <label>Ингредиенты</label>
                <div id="ingredientsList">
        `;

        const ingredients = meal.ingredients || [{ product: '', unit: 'г', weight_cooked: 0, weight_raw: 0 }];
        for (let i = 0; i < ingredients.length; i++) {
            const ing = ingredients[i];
            html += `
                <div class="ingredient-row" data-index="${i}">
                    <input type="text" class="ingr-product" value="${escapeHtml(ing.product)}" placeholder="Продукт" style="flex:2;">
                    <input type="number" class="ingr-weight-cooked" value="${ing.weight_cooked}" placeholder="Готовый вес" step="any" style="flex:1;">
                    <input type="number" class="ingr-weight-raw" value="${ing.weight_raw || ing.weight_cooked}" placeholder="Сырой вес" step="any" style="flex:1;">
                    <input type="text" class="ingr-unit" value="${escapeHtml(ing.unit)}" placeholder="г/мл/шт" style="flex:0.7;">
                    <button class="btn-remove-ingr" data-index="${i}">✕</button>
                </div>
            `;
        }

        html += `
                </div>
                <button class="btn-add-ingr" id="addIngredientBtn">➕ Добавить ингредиент</button>
            </div>
            <div class="form-group">
                <label>Способ приготовления</label>
                <textarea id="editMealMethod">${escapeHtml(meal.method || '')}</textarea>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" id="modalCancelBtn">Отмена</button>
                <button class="btn-save" id="modalSaveBtn">💾 Сохранить</button>
            </div>
        `;

        content.innerHTML = html;
        modal.classList.add('active');

        document.getElementById('modalCancelBtn').addEventListener('click', closeModal);
        document.getElementById('modalSaveBtn').addEventListener('click', saveMeal);

        document.getElementById('addIngredientBtn').addEventListener('click', function() {
            const list = document.getElementById('ingredientsList');
            const index = list.children.length;
            const row = document.createElement('div');
            row.className = 'ingredient-row';
            row.dataset.index = index;
            row.innerHTML = `
                <input type="text" class="ingr-product" placeholder="Продукт" style="flex:2;">
                <input type="number" class="ingr-weight-cooked" placeholder="Готовый вес" step="any" style="flex:1;">
                <input type="number" class="ingr-weight-raw" placeholder="Сырой вес" step="any" style="flex:1;">
                <input type="text" class="ingr-unit" placeholder="г/мл/шт" style="flex:0.7;">
                <button class="btn-remove-ingr" data-index="${index}">✕</button>
            `;
            list.appendChild(row);
            row.querySelector('.btn-remove-ingr').addEventListener('click', function() {
                row.remove();
            });
        });

        document.querySelectorAll('.btn-remove-ingr').forEach(btn => {
            btn.addEventListener('click', function() {
                const row = this.closest('.ingredient-row');
                if (row && document.querySelectorAll('.ingredient-row').length > 1) {
                    row.remove();
                } else {
                    alert('Должен остаться хотя бы один ингредиент');
                }
            });
        });
    }

    function closeModal() {
        document.getElementById('recipeModal').classList.remove('active');
        editingDay = null;
        editingMealType = null;
    }

    function saveMeal() {
        if (!editingDay || !editingMealType) return;
        const meal = editingDay.meals[editingMealType];
        if (!meal) return;

        meal.name = document.getElementById('editMealName').value.trim();
        meal.protein_type = document.getElementById('editProteinType').value;

        const dishTypes = [];
        document.querySelectorAll('#dishTypeCheckboxes input[type="checkbox"]:checked').forEach(cb => {
            dishTypes.push(cb.value);
        });
        meal.dish_type = dishTypes;

        const rows = document.querySelectorAll('.ingredient-row');
        const ingredients = [];
        for (const row of rows) {
            const product = row.querySelector('.ingr-product').value.trim();
            const weight_cooked = parseFloat(row.querySelector('.ingr-weight-cooked').value);
            const weight_raw = parseFloat(row.querySelector('.ingr-weight-raw').value);
            const unit = row.querySelector('.ingr-unit').value.trim() || 'г';
            if (product && !isNaN(weight_cooked) && weight_cooked > 0) {
                ingredients.push({ product, unit, weight_cooked, weight_raw: weight_raw || weight_cooked });
            }
        }
        meal.ingredients = ingredients;
        meal.method = document.getElementById('editMealMethod').value.trim();

        localStorage.setItem('mealData', JSON.stringify(allData));
        closeModal();
        render();
    }

    function getMealType(mealKey) {
        const map = { breakfast: "Завтрак", lunch: "Обед", snack: "Перекус", dinner: "Ужин" };
        return map[mealKey] || mealKey;
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ================================================================
    // 5. ФИЛЬТРЫ
    // ================================================================
    function renderFilters() {
        const container = document.getElementById('dayFilters');
        container.innerHTML = '';
        const maxDays = getMaxDays();
        for (let i = 1; i <= maxDays; i++) {
            const label = document.createElement('label');
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.checked = selectedDays.has(i);
            cb.dataset.day = i;
            cb.addEventListener('change', function() {
                const day = parseInt(this.dataset.day);
                if (this.checked) selectedDays.add(day);
                else selectedDays.delete(day);
                render();
            });
            label.appendChild(cb);
            label.appendChild(document.createTextNode(i));
            container.appendChild(label);
        }
    }

    // ================================================================
    // 6. КОРЗИНА
    // ================================================================
    function loadBasketFromStorage() {
        const saved = localStorage.getItem('basketItems');
        if (saved) {
            try {
                basketItems = JSON.parse(saved);
                return;
            } catch (e) {}
        }
        basketItems = [];
    }

    function saveBasketToStorage() {
        localStorage.setItem('basketItems', JSON.stringify(basketItems));
    }

    function buildBasket() {
        const data = getCurrentData();
        const rawBasket = {};
        const daysToCollect = data.filter(d => selectedDays.has(d.day));
        for (const day of daysToCollect) {
            const meals = ['breakfast', 'lunch', 'snack', 'dinner'];
            for (const key of meals) {
                const meal = day.meals[key];
                if (!meal || !meal.ingredients) continue;
                for (const item of meal.ingredients) {
                    const name = item.product;
                    const weight = item.weight_cooked;
                    const unit = item.unit;
                    const key = `${name}|${unit}`;
                    if (rawBasket[key]) rawBasket[key] += weight;
                    else rawBasket[key] = weight;
                }
            }
        }

        loadBasketFromStorage();

        if (basketItems.length === 0) {
            for (const [key, weight] of Object.entries(rawBasket)) {
                const parts = key.split('|');
                if (parts.length === 2) {
                    basketItems.push({ name: parts[0], weight: weight, unit: parts[1], available: false });
                } else {
                    basketItems.push({ name: key, weight: weight, unit: 'г', available: false });
                }
            }
            saveBasketToStorage();
        }

        renderBasketTable();
        document.getElementById('finalListContainer').classList.remove('hidden');
        updateFinalList();
    }

    function renderBasketTable() {
        const container = document.getElementById('basketContent');
        if (basketItems.length === 0) {
            container.innerHTML = '<div class="basket-empty">Корзина пуста. Выберите дни и нажмите «Собрать корзину»</div>';
            return;
        }

        let html = `<div class="basket-table-wrapper">
            <table class="basket-table">
                <thead>
                    <tr>
                        <th class="col-name">Название продукта</th>
                        <th class="col-weight">Вес</th>
                        <th class="col-unit">Ед. изм.</th>
                        <th class="col-check">В наличии</th>
                        <th class="col-actions">Действие</th>
                    </tr>
                </thead>
                <tbody>`;

        basketItems.forEach((item, index) => {
            const checked = item.available ? 'checked' : '';
            html += `
                <tr data-index="${index}">
                    <td class="col-name">
                        <input type="text" value="${escapeHtml(item.name)}" data-field="name" data-index="${index}">
                    </td>
                    <td class="col-weight">
                        <input type="number" value="${item.weight}" data-field="weight" data-index="${index}" step="any">
                    </td>
                    <td class="col-unit">
                        <input type="text" value="${escapeHtml(item.unit)}" data-field="unit" data-index="${index}">
                    </td>
                    <td class="col-check">
                        <input type="checkbox" ${checked} data-field="available" data-index="${index}">
                    </td>
                    <td class="col-actions">
                        <button class="btn-icon delete" data-index="${index}" title="Удалить">🗑️</button>
                    </td>
                </tr>`;
        });

        html += `
                <tr class="add-row">
                    <td><input type="text" id="newName" placeholder="Название"></td>
                    <td><input type="number" id="newWeight" placeholder="Вес" step="any"></td>
                    <td><input type="text" id="newUnit" placeholder="г / мл / шт"></td>
                    <td></td>
                    <td><button class="btn-add" id="addProductBtn">➕ Добавить</button></td>
                </tr>
            </tbody></table></div>`;

        container.innerHTML = html;

        container.querySelectorAll('input[data-field]').forEach(input => {
            input.addEventListener('change', function() {
                const index = parseInt(this.dataset.index);
                const field = this.dataset.field;
                if (field === 'name') basketItems[index].name = this.value;
                else if (field === 'weight') basketItems[index].weight = parseFloat(this.value) || 0;
                else if (field === 'unit') basketItems[index].unit = this.value;
                else if (field === 'available') basketItems[index].available = this.checked;
                saveBasketToStorage();
                updateFinalList();
            });
        });

        container.querySelectorAll('.btn-icon.delete').forEach(btn => {
            btn.addEventListener('click', function() {
                const index = parseInt(this.dataset.index);
                basketItems.splice(index, 1);
                saveBasketToStorage();
                renderBasketTable();
                updateFinalList();
            });
        });

        document.getElementById('addProductBtn').addEventListener('click', function() {
            const name = document.getElementById('newName').value.trim();
            const weight = parseFloat(document.getElementById('newWeight').value);
            const unit = document.getElementById('newUnit').value.trim() || 'г';
            if (!name || isNaN(weight) || weight <= 0) {
                alert('Пожалуйста, заполните название и вес');
                return;
            }
            basketItems.push({ name, weight, unit, available: false });
            saveBasketToStorage();
            renderBasketTable();
            updateFinalList();
            document.getElementById('newName').value = '';
            document.getElementById('newWeight').value = '';
            document.getElementById('newUnit').value = '';
        });
    }

    function updateFinalList() {
        const container = document.getElementById('finalListContent');
        const notAvailable = basketItems.filter(item => !item.available);

        if (notAvailable.length === 0) {
            container.innerHTML = '<div class="basket-empty">Все продукты отмечены как «В наличии» — ничего не нужно покупать! 🎉</div>';
            return;
        }

        let html = `<div class="basket-table-wrapper">
            <table class="basket-table">
                <thead>
                    <tr>
                        <th class="col-name">Название продукта</th>
                        <th class="col-weight">Вес</th>
                        <th class="col-unit">Ед. изм.</th>
                    </tr>
                </thead>
                <tbody>`;

        for (const item of notAvailable) {
            const w = typeof item.weight === 'number' ? item.weight : 1;
            html += `
                <tr>
                    <td class="col-name">${escapeHtml(item.name)}</td>
                    <td class="col-weight">${w}</td>
                    <td class="col-unit">${escapeHtml(item.unit)}</td>
                </tr>`;
        }

        html += `</tbody></table></div>`;
        container.innerHTML = html;
    }

    // ================================================================
    // 7. ИНИЦИАЛИЗАЦИЯ
    // ================================================================
    document.getElementById('selectAllDays').addEventListener('click', function() {
        const maxDays = getMaxDays();
        for (let i = 1; i <= maxDays; i++) selectedDays.add(i);
        document.querySelectorAll('#dayFilters input[type="checkbox"]').forEach(cb => cb.checked = true);
        render();
    });

    document.getElementById('clearAllDays').addEventListener('click', function() {
        selectedDays.clear();
        document.querySelectorAll('#dayFilters input[type="checkbox"]').forEach(cb => cb.checked = false);
        render();
    });

    document.getElementById('buildBasket').addEventListener('click', buildBasket);

    document.querySelectorAll('#blockSwitcher button').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('#blockSwitcher button').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentMode = this.dataset.block;
            initSelectedDays();
            renderFilters();
            render();
            basketItems = [];
            localStorage.removeItem('basketItems');
            document.getElementById('finalListContainer').classList.add('hidden');
            document.getElementById('basketContent').innerHTML = '<div class="basket-empty">Нажмите «Собрать корзину», чтобы увидеть список продуктов</div>';
        });
    });

    document.querySelectorAll('input[name="protein"]').forEach(el => {
        el.addEventListener('change', function() {
            currentProteinFilter = this.value;
            render();
        });
    });

    document.getElementById('dishTypeFilter').addEventListener('change', function() {
        currentDishFilter = this.value;
        render();
    });

    loadBasketFromStorage();
    loadData();
</script>
</body>
</html>
